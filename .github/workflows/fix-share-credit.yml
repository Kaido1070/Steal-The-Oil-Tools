name: One-time fix share credit layout

on:
  push:
    branches: [main]
    paths:
      - '.trigger-fix-share-credit'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Share credit placement only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_top = '.share-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}'
          new_top = '.share-top{position:relative;z-index:1;display:block}'

          old_credit = '.share-credit{position:absolute;right:0;bottom:-13px;color:#778195;font-size:7px;font-weight:750;text-align:right;white-space:nowrap;opacity:.78}'
          new_credit = '.share-credit{margin-top:7px;color:#778195;font-size:7px;font-weight:750;text-align:right;white-space:nowrap;opacity:.78;line-height:1.2}'

          checks = {
              'share-top': s.count(old_top),
              'share-credit': s.count(old_credit),
          }
          if any(v != 1 for v in checks.values()):
              raise SystemExit(f'No changes made; exact-match check failed: {checks}')

          s = s.replace(old_top, new_top, 1)
          s = s.replace(old_credit, new_credit, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Share creator credit placement"
          git push
