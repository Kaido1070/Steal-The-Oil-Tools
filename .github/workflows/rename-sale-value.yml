name: Rename Estimated Cash to Sale Value

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-sale-value.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename sale result label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old = 'Estimated Cash'
          new = 'Sale Value'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Estimated Cash not found')
          s = s.replace(old, new)
          path.write_text(s, encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename sale result to Sale Value"
          git push
