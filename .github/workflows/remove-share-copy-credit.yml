name: One-time remove Share copy credit

on:
  push:
    branches: [main]
    paths:
      - '.trigger-remove-share-copy-credit'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove creator credit from Share copy text only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  function shareSummary() {
    return [
      "STEAL THE OIL TYCOON — Sale Calculator",
      `Sale Value: ${els.totalCash.textContent}`,
      `Oil Amount: ${els.oil.value}`,
      `Cash per Oil: ${els.cashPerOil.textContent}`,
      `Sell Price: ${els.market.value}`,
      `Cash Boost: ${els.cashBoost.value}%`,
      `Friend Boost: ${friendBoostValue}%`,
      "Created by 1yono",
    ].join("\\n");
  }
'''
          new = '''  function shareSummary() {
    return [
      "STEAL THE OIL TYCOON — Sale Calculator",
      `Sale Value: ${els.totalCash.textContent}`,
      `Oil Amount: ${els.oil.value}`,
      `Cash per Oil: ${els.cashPerOil.textContent}`,
      `Sell Price: ${els.market.value}`,
      `Cash Boost: ${els.cashBoost.value}%`,
      `Friend Boost: ${friendBoostValue}%`,
    ].join("\\n");
  }
'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 shareSummary match, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove creator credit from Share copy"
          git push
