name: Update Number of Drills icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-drill-count-icon.yml'

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace drill count icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''          <div class="icon" aria-label="Clock Drill count icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="10" class="softfill" stroke-width="1.6"/>
              <path d="M16 10v7l5 3M7 25l4-4M25 25l-4-4" class="pink" stroke-width="1.7"/>
            </svg>
          </div>'''
          new = '''          <div class="icon" aria-label="Drill quantity icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="10" cy="11" r="4.2" class="softfill" stroke-width="1.5"/>
              <circle cx="22" cy="11" r="4.2" class="pinkfill" stroke-width="1.5"/>
              <circle cx="16" cy="21" r="4.4" class="softfill" stroke-width="1.5"/>
              <circle cx="10" cy="11" r="1.1" class="goldfill"/>
              <circle cx="22" cy="11" r="1.1" class="goldfill"/>
              <circle cx="16" cy="21" r="1.1" class="goldfill"/>
            </svg>
          </div>'''
          if old not in s:
              raise SystemExit('Expected Number of Drills icon block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Number of Drills icon"
          git push
