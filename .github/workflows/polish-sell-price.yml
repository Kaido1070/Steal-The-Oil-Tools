name: Polish Sell Price wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-sell-price.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Sell Price wording consistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          replacements = {
              '<h2>Sell Rate</h2>': '<h2>Sell Price</h2>',
              'aria-label="Sale rate presets"': 'aria-label="Sell Price presets"',
              'type another sell rate manually.': 'type another price manually.',
              'Enter a sell rate.': 'Enter a sell price.',
              'Enter a valid sell rate.': 'Enter a valid sell price.',
              'Sell rate cannot be negative.': 'Sell price cannot be negative.',
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed == 0:
              raise SystemExit('No Sell Price wording changes found')
          path.write_text(s, encoding='utf-8')
          print(f'Updated {changed} wording pattern(s)')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Sell Price wording"
          git push
