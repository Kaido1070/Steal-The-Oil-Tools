name: One-time adjust share credit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust Share credit position only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.share-credit{color:#aeb6c9;font-size:9.5px;font-weight:800;text-align:right;white-space:nowrap}'
          new = '.share-credit{position:absolute;right:0;bottom:-13px;color:#778195;font-size:7px;font-weight:750;text-align:right;white-space:nowrap;opacity:.78}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one share-credit rule, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Share creator credit subtle"
          git push
