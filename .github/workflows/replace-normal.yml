name: Update x1 labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-normal.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Normal with x1
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('allowNormal', 'allowBaseUnit')
          s = s.replace('Normal', 'x1')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/replace-normal.yml
          git diff --cached --quiet || git commit -m "Replace Normal with x1"
          git push
