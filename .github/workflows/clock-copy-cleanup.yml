name: Clock Drill copy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clock-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Clock Drill labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('<div class="tool-intro">Choose the drill tier, how many you own, and how long they run.</div>', '<div class="tool-intro">Choose your Clock Drill setup.</div>'),
              ('<div class="step-head"><h2>Clock Drill Tier</h2><span>Growth multiplier</span></div>', '<div class="step-head"><h2>Drill Tier</h2><span>Growth multiplier</span></div>'),
              ('<div class="labels"><strong>Drills Owned</strong></div>', '<div class="labels"><strong>Drill Count</strong></div>'),
              ('aria-label="Drills Owned"', 'aria-label="Drill Count"'),
              ('<div class="result-head"><h2>Clock Drill estimate</h2><span class="live-status">Live</span></div>', '<div class="result-head"><h2>Clock Drill Result</h2><span class="live-status">Live</span></div>'),
              ('      <div class="formula-note">Basic starts at 1 oil/s and gains +1 oil/s each second. Tier, drill count, and Production Multiplier scale it.</div>\n', ''),
              ('          "Drills Owned",', '          "Drill Count",'),
              ('          "<b>Copy</b> copies the Clock Drill estimate to your clipboard. <b>Reset</b> returns the Clock Drill calculator to <b>Basic</b>, <b>×1 Standard</b>, <b>1 drill</b>, and <b>1 hour</b>."', '          "<b>Copy</b> copies the Clock Drill result to your clipboard. <b>Reset</b> returns the Clock Drill calculator to <b>Basic</b>, <b>×1 Standard</b>, <b>1 drill</b>, and <b>1 hour</b>."'),
              ('      `Drills Owned: ${els.drillCount.value}`,', '      `Drill Count: ${els.drillCount.value}`,'),
              ('      countMessage = "Enter how many drills you own.";', '      countMessage = "Enter a drill count.";'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 match, found {count}: {old}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Clock Drill labels"
          git push
