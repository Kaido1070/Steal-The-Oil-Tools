name: Rename Current Sell Rate to Sell Price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-sell-price.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename sell price label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old = 'Current Sell Rate'
          new = 'Sell Price'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Current Sell Rate not found')
          s = s.replace(old, new)
          path.write_text(s, encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename sell rate to Sell Price"
          git push
