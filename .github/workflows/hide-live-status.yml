name: One-time hide Live status

on:
  push:
    branches: [main]
    paths:
      - '.trigger-hide-live'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide Live status only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.live-status{display:inline-flex;align-items:center;gap:5px;color:#8de7bd!important}'
          new = '.live-status{display:none!important}'
          if s.count(old) != 1:
              raise SystemExit(f'No changes made; expected exactly one Live status CSS rule, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Live status from results"
          git push
