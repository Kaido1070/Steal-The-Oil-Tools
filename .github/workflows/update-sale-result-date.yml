name: Update sale result title and date

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sale-result-date.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update sale result title and date
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = {
              '<div class="result-head"><h2>Sale estimate</h2><span id="status" class="live-status">Live</span></div>': '<div class="result-head"><h2>Sale Result</h2><span id="status" class="live-status">Live</span></div>',
              'Last updated Aug 20 2026': 'Last updated Aug 21 2026',
          }

          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit('Missing expected text: ' + repr(missing))

          for old, new in replacements.items():
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Sale Result title and date"
          git push
