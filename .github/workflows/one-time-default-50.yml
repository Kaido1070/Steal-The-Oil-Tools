name: One-time default 50 x1

on:
  push:
    branches: [main]
    paths:
      - '.trigger-default-50'

permissions:
  contents: write

jobs:
  update-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update default values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old = '''<input id="productionRate" value="1M" inputmode="decimal" autocomplete="off" aria-label="Oil per Second" aria-describedby="productionRateError" />
        <div class="presets rate-units" aria-label="Production rate units">
          <button class="chip secondary-chip" type="button" data-rate-unit="">x1</button>
          <button class="chip secondary-chip" type="button" data-rate-unit="K">K</button>
          <button class="chip secondary-chip active" type="button" data-rate-unit="M">M</button>'''
          new = '''<input id="productionRate" value="50" inputmode="decimal" autocomplete="off" aria-label="Oil per Second" aria-describedby="productionRateError" />
        <div class="presets rate-units" aria-label="Production rate units">
          <button class="chip secondary-chip active" type="button" data-rate-unit="">x1</button>
          <button class="chip secondary-chip" type="button" data-rate-unit="K">K</button>
          <button class="chip secondary-chip" type="button" data-rate-unit="M">M</button>'''

          if old not in s:
              raise SystemExit('Expected Oil / Hour default block not found')
          s = s.replace(old, new, 1)

          old_help = 'and Oil to <b>50</b>.'
          new_help = 'and Oil to <b>50 (x1)</b>.'
          if old_help not in s:
              raise SystemExit('Expected Sale help text not found')
          s = s.replace(old_help, new_help, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .trigger-default-50 .github/workflows/one-time-default-50.yml
          git add index.html
          git commit -m "Set Oil Hour default to 50 x1"
          git push
