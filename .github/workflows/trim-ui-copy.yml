name: Trim UI copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trim-ui-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trim redundant UI and help copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = {
              '<div class="step-head"><h2>Your Oil</h2><span>Amount + unit</span></div>': '<div class="step-head"><h2>Your Oil</h2></div>',
              '<div class="labels"><strong>Cash Boost</strong><small>Enter the Cash Boost shown in game</small></div>': '<div class="labels"><strong>Cash Boost</strong></div>',
              '<div class="labels"><strong>Friend Boost</strong><small>Choose your current Friend Boost</small></div>': '<div class="labels"><strong>Friend Boost</strong></div>',
              '    <div class="tool-intro">Enter how much oil you produce each second.</div>\n\n': '',
              '<div class="step-head"><h2>Time</h2><span>Choose a preset or enter up to 20 hours</span></div>': '<div class="step-head"><h2>Time</h2><span>Up to 20 hours</span></div>',
              '<div class="labels"><strong>Hours</strong><small>Quick options or enter up to 20 hours</small></div>': '<div class="labels"><strong>Hours</strong></div>',
              '<div class="step-head"><h2>Target Oil</h2><span>How much oil you want to reach</span></div>': '<div class="step-head"><h2>Target Oil</h2></div>',
              '<div class="labels"><strong>Drills Owned</strong><small>How many you own</small></div>': '<div class="labels"><strong>Drills Owned</strong></div>',
              '          "Result",': '          "Sale Result",',
              '          "Choose the multiplier for the area you are in: <b>×1 Standard</b>, <b>×2</b>, <b>×3</b>, <b>×5</b>, <b>×6</b>, or <b>×10</b>. This multiplier scales the Clock Drill production shown in Final Rate, Total Oil, and Growth per Second."': '          "Choose your area Production Multiplier. It scales the Clock Drill production."',
              '          "Choose <b>1h</b>, <b>3h</b>, <b>5h</b>, <b>7h</b>, or <b>9h</b> as a quick option, or type the time manually. The maximum allowed time is <b>20 hours</b>."': '          "Enter a run time up to <b>20 hours</b>."',
              '<div class="formula-note">Assumption: each Basic Clock Drill starts at 1 oil/s, then gains +1 oil/s every second. Tier, drill count, and Production Multiplier scale the displayed production.</div>': '<div class="formula-note">Basic starts at 1 oil/s and gains +1 oil/s each second. Tier, drill count, and Production Multiplier scale it.</div>',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Missing expected text: ' + old)
              s = s.replace(old, new, 1)

          oil_results_block = '''        [
          "Results",
          "Time → Oil shows your <b>Oil Gain</b> plus per-hour and per-minute production. Oil → Time shows the <b>Time Needed</b>, total hours, and your hourly production."
        ],
'''
          if oil_results_block not in s:
              raise SystemExit('Missing Oil / Hour Results help block')
          s = s.replace(oil_results_block, '', 1)

          drill_tier_block = '''        [
          "Drill Tier",
          "Choose the Clock Drill version you own: <b>Basic ×1</b>, <b>Gold ×2</b>, <b>Diamond ×3</b>, <b>Rainbow ×5</b>, or <b>Galaxy ×10</b>."
        ],
'''
          if drill_tier_block not in s:
              raise SystemExit('Missing Clock Drill tier help block')
          s = s.replace(drill_tier_block, '', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Trim redundant UI copy"
          git push
