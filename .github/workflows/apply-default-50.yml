name: Apply default 50 x1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-default-50.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('id="productionRate" value="1M"', 'id="productionRate" value="50"'),
            ('<button class="chip secondary-chip" type="button" data-rate-unit="">x1</button>', '<button class="chip secondary-chip active" type="button" data-rate-unit="">x1</button>'),
            ('<button class="chip secondary-chip active" type="button" data-rate-unit="M">M</button>', '<button class="chip secondary-chip" type="button" data-rate-unit="M">M</button>'),
            ('and Oil to <b>50</b>.', 'and Oil to <b>50 (x1)</b>.'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Missing expected text: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set Oil Hour default to 50 x1"
          git push
