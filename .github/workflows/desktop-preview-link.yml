name: Link desktop preview stylesheet

on:
  push:
    branches: [desktop-layout-preview]
    paths:
      - '.trigger-desktop-preview'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add desktop stylesheet link only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="desktop.css" media="(min-width: 900px)" />\n'
          if 'href="desktop.css"' not in s:
              marker = '  <title>STEAL THE OIL TYCOON — Calculator</title>\n'
              if marker not in s:
                  raise SystemExit('Title marker not found; refusing to modify file')
              s = s.replace(marker, marker + link, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Link desktop-only stylesheet"
          git push
