name: Polish Number of Drills wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-number-of-drills.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Number of Drills wording consistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'The selected tier, drill count, and Production Multiplier scale that rate.': 'The selected tier, number of drills, and Production Multiplier scale that rate.',
              'after applying the tier, drill count, and Production Multiplier.': 'after applying the tier, number of drills, and Production Multiplier.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep Number of Drills wording consistent"
          git push
