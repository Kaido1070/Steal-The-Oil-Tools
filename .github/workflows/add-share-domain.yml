name: Add domain to share card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-share-domain.yml'

permissions:
  contents: write

jobs:
  update-share-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add domain visually to share card only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_css = '.share-credit b{color:#fff}\n'
          new_css = '.share-credit b{color:#fff}\n    .share-domain{display:block;margin-top:3px;color:#7f899c;font-size:8px;font-weight:800;letter-spacing:.2px}\n'
          if old_css not in s:
              raise SystemExit('Expected share credit CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_html = '<div class="share-credit">Made by <b>1yono</b></div>'
          new_html = '<div class="share-credit">Made by <b>1yono</b><span class="share-domain">stealoiltools.xyz</span></div>'
          if old_html not in s:
              raise SystemExit('Expected share credit HTML not found')
          s = s.replace(old_html, new_html, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add domain to share card"
          git push
