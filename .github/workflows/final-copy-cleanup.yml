name: Final copy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean up help copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ('Enter the <b>Cash Boost</b> value shown in game. Enter this value manually.', 'Enter the <b>Cash Boost</b> value shown in game.'),
              ('Choose your current Friend Boost using the percentage buttons. Use the buttons to choose your Friend Boost.', 'Use the percentage buttons to choose your current Friend Boost.'),
              ('This shows how much the combined rate increases every second after applying the tier multiplier and drill count.', 'This shows how much the combined rate increases every second after applying the tier, drill count, and Production Multiplier.'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up help copy"
          git push
