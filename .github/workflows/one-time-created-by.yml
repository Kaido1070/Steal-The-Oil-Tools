name: One-time Created by update

on:
  push:
    branches: [main]
    paths:
      - '.trigger-created-by-once'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace creator credit only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s.count('Made by 1yono') + s.count('Made by <b>1yono</b>')
          s = s.replace('Made by 1yono', 'Created by 1yono')
          s = s.replace('Made by <b>1yono</b>', 'Created by <b>1yono</b>')
          p.write_text(s, encoding='utf-8')
          print('Updated creator credit only')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use Created by for creator credit"
          git push
