name: Unify Oil Hour result wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-oil-hour-wording.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unify Oil Hour wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = {
              'els.productionTotalLabel.textContent = "Time Required";': 'els.productionTotalLabel.textContent = "Time Needed";',
              '`Time Required: ${els.productionTotal.textContent}`': '`Time Needed: ${els.productionTotal.textContent}`',
              '`Total Oil: ${els.productionTotal.textContent}`': '`Oil Gain: ${els.productionTotal.textContent}`',
              '"Time → Oil shows your total oil plus per-hour and per-minute production. Oil → Time shows the required time, total hours, and your hourly production."': '"Time → Oil shows your <b>Oil Gain</b> plus per-hour and per-minute production. Oil → Time shows the <b>Time Needed</b>, total hours, and your hourly production."',
              '"Enter your oil-per-second rate and a duration to see how much oil you will produce. The time you enter is limited to <b>20 hours</b>."': '"Enter your oil-per-second rate and a duration to see your <b>Oil Gain</b>. The time you enter is limited to <b>20 hours</b>."',
              '"Enter your oil-per-second rate and a <b>Target Oil</b> amount to calculate how long it takes to reach that target. The calculated time can be more than 20 hours because it is a result, not a manual time input."': '"Enter your oil-per-second rate and a <b>Target Oil</b> amount to see the <b>Time Needed</b> to reach it. The calculated time can be more than 20 hours because it is a result, not a manual time input."',
          }

          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit('Missing expected text: ' + repr(missing))

          for old, new in replacements.items():
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify Oil Hour result wording"
          git push
