name: Apply v5.3 split release

on:
  push:
    paths:
      - '.github/workflows/apply-v53-split.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified release files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/release.b64 > /tmp/release.tar.xz
          echo '33cc28f07b9b1bcb1cd9bd359c10ab38598782c5ecda11dfb53f8a6e7480b250  /tmp/release.tar.xz' | sha256sum -c -
          tar -xJf /tmp/release.tar.xz -C .
          mkdir -p assets/images
          touch assets/images/.gitkeep
          rm -f desktop.css
          node --check js/app.js
          test -s index.html
          test -s css/main.css
          test -s js/app.js
          grep -q 'css/main.css' index.html
          grep -q 'js/app.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/main.css js/app.js assets/images/.gitkeep desktop.css
          git commit -m 'Publish v5.3 tools and split site files'
          git push
