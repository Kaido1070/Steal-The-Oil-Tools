name: Apply v5.3 split release

on:
  push:
    paths:
      - '.github/workflows/apply-v53-split.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified release
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/v53/chunk-00.txt .deploy/v53/chunk-01.txt .deploy/v53/chunk-02.txt .deploy/v53/chunk-03.txt > /tmp/release.b64
          test "$(wc -c < /tmp/release.b64)" -eq 44268
          base64 -d /tmp/release.b64 > /tmp/release.tar.xz
          echo '5afe35f1562597dc77019331762d4b182d5163ea5eca3f310d408c0431c01d0b  /tmp/release.tar.xz' | sha256sum -c -
          tar -xJf /tmp/release.tar.xz -C .
          mkdir -p assets/images
          touch assets/images/.gitkeep
          rm -f desktop.css
          node --check js/app.js
          test -s index.html
          test -s css/main.css
          test -s js/app.js
          grep -q 'css/main.css' index.html
          grep -q 'js/app.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish v5.3 tools and split site files'
          git push
