name: Unify tool icons

on:
  push:
    branches: [main]
    paths:
      - '.trigger-unify-icons'

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify oil icons and update drill count icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          oil_amount_old = '''        <div class="icon" aria-label="Oil icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 6h10l3 3-4 4H9z" class="softfill" stroke-width="1.7"/><path d="M8 12l10 8-2.5 2.5-9-9z" class="pink" stroke-width="1.7"/><path d="M12.5 23.2c0 2-1.7 3.3-3.4 3.3s-3.4-1.3-3.4-3.3c0-1.8 3.4-5.2 3.4-5.2s3.4 3.4 3.4 5.2Z" class="pinkfill" stroke-width="1.5"/></svg></div>'''
          oil_amount_new = '''        <div class="icon" aria-label="Oil icon">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 5s-6 7-6 12a6 6 0 0 0 12 0c0-5-6-12-6-12Z" class="pinkfill" stroke-width="1.6"/>
            <path d="M13 18c.4 2 1.6 3.2 3.6 3.6" class="gold" stroke-width="1.6"/>
          </svg>
        </div>'''

          oil_rate_old = '''          <div class="icon" aria-label="Oil rate icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 5s-6 7-6 12a6 6 0 0 0 12 0c0-5-6-12-6-12Z" class="pinkfill" stroke-width="1.6"/>
              <path d="M8 25h16M21 8l4-3M23 12h4" class="gold" stroke-width="1.6"/>
            </svg>
          </div>'''
          oil_rate_new = '''          <div class="icon" aria-label="Oil rate icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 5s-6 7-6 12a6 6 0 0 0 12 0c0-5-6-12-6-12Z" class="pinkfill" stroke-width="1.6"/>
              <path d="M13 18c.4 2 1.6 3.2 3.6 3.6" class="gold" stroke-width="1.6"/>
            </svg>
          </div>'''

          target_old = '''          <div class="icon" aria-label="Target oil icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="10" class="softfill" stroke-width="1.6"/>
              <circle cx="16" cy="16" r="5" class="pinkfill" stroke-width="1.5"/>
              <circle cx="16" cy="16" r="1.8" class="goldfill"/>
            </svg>
          </div>'''
          target_new = '''          <div class="icon" aria-label="Target oil icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 5s-6 7-6 12a6 6 0 0 0 12 0c0-5-6-12-6-12Z" class="pinkfill" stroke-width="1.6"/>
              <path d="M13 18c.4 2 1.6 3.2 3.6 3.6" class="gold" stroke-width="1.6"/>
            </svg>
          </div>'''

          drills_old = '''          <div class="icon" aria-label="Clock Drill count icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="10" class="softfill" stroke-width="1.6"/>
              <path d="M16 10v7l5 3M7 25l4-4M25 25l-4-4" class="pink" stroke-width="1.7"/>
            </svg>
          </div>'''
          drills_new = '''          <div class="icon" aria-label="Drill quantity icon">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <g transform="translate(2.5 3)">
                <path d="M2 2h7l2 2-2 2H4z" class="softfill" stroke-width="1.2"/>
                <path d="M5 6l3.4 3-1.4 1.5-3.5-3.2z" class="pink" stroke-width="1.2"/>
              </g>
              <g transform="translate(15.5 3)">
                <path d="M2 2h7l2 2-2 2H4z" class="pinkfill" stroke-width="1.2"/>
                <path d="M5 6l3.4 3-1.4 1.5-3.5-3.2z" class="gold" stroke-width="1.2"/>
              </g>
              <g transform="translate(9 15)">
                <path d="M2 2h7l2 2-2 2H4z" class="softfill" stroke-width="1.2"/>
                <path d="M5 6l3.4 3-1.4 1.5-3.5-3.2z" class="pink" stroke-width="1.2"/>
              </g>
            </svg>
          </div>'''

          replacements = [
              (oil_amount_old, oil_amount_new, 'Oil Amount icon'),
              (oil_rate_old, oil_rate_new, 'Oil per Second icon'),
              (target_old, target_new, 'Target Oil icon'),
              (drills_old, drills_new, 'Number of Drills icon'),
          ]

          for old, new, label in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify oil and drill icons"
          git push
