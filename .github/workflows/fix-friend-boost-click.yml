name: One-time Friend Boost click fix

on:
  push:
    branches: [main]
    paths:
      - '.trigger-fix-friend-boost'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Friend Boost wrapper only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_open = '''    <label class="field">\n      <div class="field-head">\n        <div class="icon" aria-label="Friend icon">'''
          new_open = '''    <div class="field">\n      <div class="field-head">\n        <div class="icon" aria-label="Friend icon">'''

          old_close = '''      <div class="presets percent" aria-label="Friend Boost presets">\n        <button class="chip" data-friend="0">0%</button><button class="chip" data-friend="10">10%</button><button class="chip" data-friend="20">20%</button><button class="chip" data-friend="30">30%</button><button class="chip" data-friend="40">40%</button><button class="chip active" data-friend="50">50%</button>\n      </div>\n    </label>\n  </section>'''
          new_close = '''      <div class="presets percent" aria-label="Friend Boost presets">\n        <button class="chip" data-friend="0">0%</button><button class="chip" data-friend="10">10%</button><button class="chip" data-friend="20">20%</button><button class="chip" data-friend="30">30%</button><button class="chip" data-friend="40">40%</button><button class="chip active" data-friend="50">50%</button>\n      </div>\n    </div>\n  </section>'''

          if s.count(old_open) != 1:
              raise SystemExit(f'No changes made; expected exactly one Friend Boost opening wrapper, found {s.count(old_open)}')
          if s.count(old_close) != 1:
              raise SystemExit(f'No changes made; expected exactly one Friend Boost closing wrapper, found {s.count(old_close)}')

          s = s.replace(old_open, new_open, 1)
          s = s.replace(old_close, new_close, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Friend Boost accidental 0 percent selection"
          git push
