name: Rename Drill Count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-drill-count.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Drill Count text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<strong>Drill Count</strong>': '<strong>Number of Drills</strong>',
              'aria-label="Drill Count"': 'aria-label="Number of Drills"',
              '          "Drill Count",': '          "Number of Drills",',
              'countMessage = "Enter a drill count.";': 'countMessage = "Enter the number of drills.";',
              'countMessage = "Enter a valid drill count.";': 'countMessage = "Enter a valid number of drills.";',
              'countMessage = "Drill count cannot be negative.";': 'countMessage = "Number of drills cannot be negative.";',
              'countMessage = "Drill count must be a whole number.";': 'countMessage = "Number of drills must be a whole number.";',
              '`Drill Count: ${els.drillCount.value}`': '`Number of Drills: ${els.drillCount.value}`',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Number of Drills label"
          git push
